name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pytest>=7.2.1,<9" "pytest-mock>=3.11.1,<4"
      # Live tests skip: no OCTEN_LIVE / OCTEN_API_KEY in CI.
      - name: Test
        run: pytest tests

  # Lowest supported llama-index-core: it builds tool metadata differently.
  test-min-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "llama-index-core==0.13.0" "pytest>=7.2.1,<9" "pytest-mock>=3.11.1,<4"
      - name: Test
        run: pytest tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "ruff>=0.11.0,<1" "mypy>=0.991,<2"
      - name: Ruff
        run: ruff check llama_index tests
      - name: Mypy
        run: mypy llama_index
